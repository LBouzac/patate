<!doctype html>
<html lang="fr" class="h-full bg-slate-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dessine</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="h-full text-slate-100 antialiased">

<!-- Accueil -->
<main id="home" class="mx-auto min-h-full max-w-xl px-4 pt-4 pb-32">
  <a href="/" class="-ml-1 inline-flex items-center gap-0.5 py-2 text-[17px] text-pink-400 transition-opacity hover:opacity-80">
    <i data-icon="chevron-left" class="size-5"></i>Les jeux
  </a>
  <form class="mt-4">
    <div class="flex items-center gap-3 px-1">
      <span class="grid size-11 shrink-0 place-items-center rounded-[10px] text-white bg-pink-500"><i data-icon="sparkles" class="size-7"></i></span>
      <h1 class="text-[34px] leading-tight font-bold">Dessine</h1>
    </div>
    <p class="mt-2 px-1 text-[15px] text-slate-400">Envoie une photo, quelqu'un la dessine en 30 s, les autres devinent.</p>

    <h2 class="mt-7 mb-2 px-4 text-[13px] text-slate-400 uppercase">Ton pseudo</h2>
    <label class="block">
      <span class="sr-only">Pseudo</span>
      <input id="name" maxlength="12" required autocomplete="nickname" placeholder="Ton pseudo" class="h-[50px] w-full rounded-xl bg-slate-900 px-4 text-[17px] ring-1 ring-white/5 placeholder:text-slate-500 focus-visible:ring-2 focus:outline-none focus-visible:ring-pink-400">
    </label>

    <button id="create" class="mt-6 flex h-[50px] w-full items-center justify-center gap-2 rounded-xl bg-pink-400 hover:bg-pink-300 text-[17px] font-semibold text-slate-950 transition active:scale-[0.98]">
      <i data-icon="plus-circle" class="size-5"></i> Créer une partie
    </button>

    <h2 class="mt-7 mb-2 px-4 text-[13px] text-slate-400 uppercase">Rejoindre une partie</h2>
    <div class="flex items-center rounded-xl bg-slate-900 ring-1 ring-white/5">
      <label class="block min-w-0 flex-1">
        <span class="sr-only">Code de la partie</span>
        <input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Code à 4 chiffres"
          class="h-[50px] w-full rounded-l-xl bg-transparent px-4 font-mono text-[17px] tracking-widest placeholder:font-sans placeholder:tracking-normal placeholder:text-slate-500 focus:outline-none">
      </label>
      <button id="join" class="h-[50px] shrink-0 rounded-r-xl px-4 text-[17px] font-semibold text-pink-400 transition hover:bg-white/5 active:bg-white/10">Rejoindre</button>
    </div>
    <p class="mt-2 px-4 text-[13px] leading-snug text-slate-400">Celui qui a créé la partie te donne le code, ou t'envoie directement le lien.</p>

    <p id="errBox" role="alert" class="mt-4 flex min-h-5 items-center justify-center gap-2 text-[15px] text-red-400">
      <i data-icon="exclamation-triangle" class="size-4" id="errIcon"></i><span id="err"></span>
    </p>
  </form>
</main>
<nav id="games" aria-label="Jeux"></nav>

<!-- Partie -->
<main id="game" hidden class="mx-auto flex min-h-full max-w-5xl flex-col justify-center gap-3 p-4">
  <header class="flex items-center justify-between gap-2">
    <button id="copy" title="Copier le lien d'invitation"
      class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 font-mono text-lg font-bold text-amber-300 transition hover:bg-white/15">
      <i data-icon="hashtag" class="size-4"></i><span id="pinTxt"></span>
      <i data-icon="link" class="size-4 text-slate-400" id="copyLink"></i><i data-icon="check" class="size-4 text-emerald-400" id="copyOk" hidden></i>
    </button>
    <span class="flex items-center gap-2">
      <span id="round" class="rounded-full bg-white/10 px-3 py-1.5 text-sm text-slate-300"></span>
      <span id="timer" class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 font-mono font-bold text-amber-300 tabular-nums">
        <i data-icon="clock" class="size-4"></i><span id="timerTxt"></span>
      </span>
    </span>
    <button id="mute" title="Couper / remettre le son" aria-label="Son"
      class="grid size-10 place-items-center rounded-full bg-white/10 text-slate-300 transition hover:bg-white/15">
      <i data-icon="speaker-wave" class="size-5" id="soundOn"></i><i data-icon="speaker-x-mark" class="size-5 text-slate-500" id="soundOff" hidden></i>
    </button>
  </header>

  <p id="status" aria-live="polite" class="text-center text-lg font-semibold"></p>

  <div class="grid gap-3 md:grid-cols-[1fr_280px]">
    <div class="flex flex-col gap-2">
      <div class="relative">
        <canvas id="c" width="1000" height="750" aria-label="Dessin"
          class="block w-full touch-none rounded-xl bg-white ring-1 ring-white/10"></canvas>
        <div id="overlay" class="absolute inset-0 grid place-items-center rounded-xl bg-slate-950/80 p-4 backdrop-blur" hidden></div>
      </div>

      <div id="tools" hidden class="flex justify-end">
        <button id="clear" class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-slate-200 transition hover:bg-white/15">
          <i data-icon="arrow-path" class="size-4"></i> Tout effacer
        </button>
      </div>

      <form id="guessForm" hidden class="flex gap-2">
        <input id="guess" maxlength="40" autocomplete="off" placeholder="C'est quoi ?"
          class="h-11 min-w-0 flex-1 rounded-xl bg-slate-900 px-4 text-[17px] ring-1 ring-white/5 placeholder:text-slate-500 focus:ring-2 focus:ring-pink-400 focus:outline-none">
        <button class="h-11 rounded-xl bg-pink-400 px-4 font-semibold text-slate-950 transition hover:bg-pink-300 active:scale-[0.98]">Proposer</button>
      </form>
    </div>

    <aside class="flex flex-col gap-3">
      <img id="photo" hidden alt="Photo à dessiner" class="w-full rounded-xl ring-1 ring-white/10">
      <ul id="players" class="space-y-1 rounded-xl bg-slate-900 p-3 text-sm ring-1 ring-white/10"></ul>
      <ul id="guesses" class="max-h-80 space-y-1 overflow-y-auto rounded-xl bg-slate-900 p-3 text-sm ring-1 ring-white/10 empty:hidden"></ul>
    </aside>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
</main>

<script src="/common.js"></script>
<script>
const cv = $('c'), ctx = cv.getContext('2d');
const W = 1000, H = 750;
let st = null, photo = '', guessKey = '', playersKey = '', overlayKey = '';

function start(pin) {
  connect('/ws/dessin', pin, '', m => {
    if (!m) { st = null; return; }
    if (!m.phase) { // messages hors état : traits, effacement, photo
      if (m.lines) { blank(); m.lines.forEach(stroke); }
      if (m.line) stroke(m.line);
      if (m.clear) blank();
      if (m.photo) { photo = m.photo; if (st?.phase === 'reveal') tada(); }
      return render();
    }
    const was = st?.phase, wasFound = st && pl(me)?.found;
    st = m;
    if (m.phase !== was) {
      if (m.phase === 'photo' || m.phase === 'wait') { blank(); photo = ''; }
      if (m.phase === 'draw') { blank(); tone(660, 0.12); }
    }
    if (!wasFound && pl(me)?.found) [523, 784].forEach((f, i) => tone(f, 0.2, 'triangle', 0.14, 0, i * 0.1));
    render();
  });
}
$('create').onclick = e => { e.preventDefault(); start(''); };
$('join').onclick = e => { e.preventDefault(); start($('pin').value.trim()); };

const pl = id => st?.players.find(p => p.id === id);
const el = (tag, cls, ...kids) => { const e = document.createElement(tag); e.className = cls; e.append(...kids); return e; };
function tada() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.12, 0, i * 0.1)); }

// ---------- Dessin ----------
ctx.lineWidth = 6; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#0f172a';
function blank() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
function stroke(p) {
  ctx.beginPath(); ctx.moveTo(p[0], p[1]);
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
  ctx.stroke();
}
blank();

const canDraw = () => st?.phase === 'draw' && st.drawer === me;
const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * W / r.width), Math.round((e.clientY - r.top) * H / r.height)]; };
let buf = null; // trait en cours, envoyé par morceaux ; chaque morceau repart du dernier point du précédent
function flush() { if (buf && buf.length >= 4) { send({ line: buf }); buf = buf.slice(-2); } }
setInterval(flush, 60);
cv.onpointerdown = e => {
  if (!canDraw()) return;
  cv.setPointerCapture(e.pointerId);
  const p = pos(e);
  buf = [...p, ...p]; stroke(buf);
};
cv.onpointermove = e => {
  if (!buf) return;
  const p = pos(e);
  stroke([buf.at(-2), buf.at(-1), ...p]);
  buf.push(...p);
  if (buf.length >= 398) flush();
};
cv.onpointerup = cv.onpointercancel = () => { flush(); buf = null; };
$('clear').onclick = () => { send({ clear: true }); blank(); };

// ---------- Photo ----------
// Réduite dans le navigateur : le serveur refuse plus de 300 Ko
$('file').onchange = async () => {
  const f = $('file').files[0];
  $('file').value = '';
  if (!f) return;
  const img = await createImageBitmap(f).catch(() => null);
  if (!img) return setStatus('Image illisible, essaie une autre');
  const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  for (const q of [0.75, 0.55, 0.35]) {
    const data = c.toDataURL('image/jpeg', q);
    if (data.length < 290000) return send({ photo: data });
  }
};

$('guessForm').onsubmit = e => {
  e.preventDefault();
  const t = $('guess').value.trim();
  if (t) send({ guess: t });
  $('guess').value = '';
};

// ---------- Interface ----------
function setStatus(t) { if ($('status').textContent !== t) $('status').textContent = t; }

function overlay(key, build) {
  if (key === overlayKey) return;
  overlayKey = key;
  show($('overlay'), !!build);
  $('overlay').replaceChildren(...(build ? [build()] : []));
}

function ranking() {
  return el('ol', 'w-full max-w-xs space-y-1', ...[...st.players].sort((a, b) => b.score - a.score).map((p, i) =>
    el('li', 'flex justify-between rounded-full bg-white/10 px-3 py-1.5' + (i === 0 ? ' text-amber-300 font-bold' : ''),
      (i + 1) + '. ' + p.name, el('span', 'font-mono', p.score + ' pts'))));
}

function startButton() {
  const enough = st.players.length >= 3;
  const b = el('button', 'inline-flex items-center gap-2 rounded-lg bg-pink-400 px-5 py-2.5 font-semibold text-slate-950 transition hover:bg-pink-300 disabled:opacity-40',
    icon('sparkles', 'size-5'), st.phase === 'end' ? 'Rejouer' : 'Commencer');
  b.disabled = !enough;
  b.onclick = () => send({ start: true });
  return el('div', 'flex flex-col items-center gap-2', b,
    el('span', 'text-sm text-slate-400', enough ? 'Chacun enverra une photo à son tour' : 'Il faut au moins 3 joueurs (' + st.players.length + '/3)'));
}

function render() {
  if (!st) return;
  const owner = pl(st.owner)?.name || '?', drawer = pl(st.drawer)?.name || '?';
  const iOwn = st.owner === me, iDraw = st.drawer === me, guessing = (st.phase === 'draw') && !iOwn && !iDraw;
  set($('pinTxt'), st.pin);
  set($('round'), st.turn ? 'Photo ' + st.turn + ' / ' + st.turns : 'En attente');
  show($('timer'), st.wait > 0);
  set($('timerTxt'), Math.ceil(st.wait));

  setStatus({
    wait: 'Salle d\'attente',
    photo: iOwn ? 'À toi : choisis une photo !' : owner + ' choisit une photo…',
    draw: iDraw ? 'Dessine la photo !' : iOwn ? drawer + ' dessine ta photo. Valide les bonnes réponses.' : pl(me)?.found ? 'Trouvé ! Attends les autres…' : drawer + ' dessine. Devine !',
    judge: iOwn ? 'Temps écoulé : juge les dernières propositions' : owner + ' juge les dernières propositions…',
    reveal: 'C\'était ça !',
    end: 'Partie terminée',
  }[st.phase]);

  if (st.phase === 'wait' || st.phase === 'end') overlay(st.phase + st.players.length, () => el('div', 'flex flex-col items-center gap-4',
    ...(st.phase === 'end' ? [el('div', 'flex items-center gap-2 text-2xl font-black text-amber-300', icon('trophy', 'size-7'), 'Classement'), ranking()] : []),
    startButton()));
  else if (st.phase === 'photo' && iOwn) overlay('photoMe', () => {
    const b = el('button', 'inline-flex items-center gap-2 rounded-lg bg-pink-400 px-5 py-2.5 font-semibold text-slate-950 transition hover:bg-pink-300', icon('plus-circle', 'size-5'), 'Choisir une photo');
    b.onclick = () => $('file').click();
    return el('div', 'flex flex-col items-center gap-2', b, el('span', 'text-sm text-slate-400', 'Seul le dessinateur la verra'));
  });
  else if (st.phase === 'photo') overlay('photo', () => el('div', 'text-lg text-slate-300', owner + ' choisit une photo…'));
  else overlay('', null);

  show($('photo'), !!photo);
  if (photo && $('photo').src !== photo) $('photo').src = photo;
  show($('tools'), iDraw && st.phase === 'draw');
  show($('guessForm'), guessing && !pl(me)?.found);

  // joueurs
  const pk = JSON.stringify([st.players, st.owner, st.drawer, st.phase]);
  if (pk !== playersKey) {
    playersKey = pk;
    $('players').replaceChildren(...[...st.players].sort((a, b) => b.score - a.score).map(p => el('li', 'flex items-center gap-2' + (p.id === me ? ' font-bold' : ''),
      el('span', 'w-5 text-center', p.id === st.owner ? '📷' : p.id === st.drawer ? '✏️' : p.found ? '✅' : ''),
      el('span', 'flex-1 truncate', p.name),
      ...(p.gain && (st.phase === 'reveal' || p.found) ? [el('span', 'text-xs text-emerald-400', '+' + p.gain)] : []),
      el('span', 'font-mono text-amber-300', p.score))));
  }

  // propositions, la plus récente en haut
  const gk = JSON.stringify([st.guesses, st.phase, st.owner]);
  if (gk !== guessKey) {
    const n = st.guesses?.length || 0, old = JSON.parse(guessKey || '[[]]')[0]?.length || 0;
    if (iOwn && n > old) tone(880, 0.06, 'sine', 0.08);
    guessKey = gk;
    $('guesses').replaceChildren(...(st.guesses || []).slice().reverse().map(g => {
      const who = pl(g.by)?.name || '?';
      const text = g.text ? '« ' + g.text + ' »' : g.ok ? 'a trouvé !' : 'a proposé…';
      const row = el('li', 'flex items-center gap-2 rounded-lg px-2 py-1 ' + (g.ok === true ? 'bg-emerald-500/15 text-emerald-300' : g.ok === false ? 'text-slate-500 line-through' : 'bg-slate-800'),
        el('span', 'flex-1 min-w-0 truncate', el('b', 'font-semibold', who), ' ' + text),
        el('span', 'font-mono text-xs text-slate-400', g.pts));
      if (iOwn && g.ok === null && (st.phase === 'draw' || st.phase === 'judge')) {
        for (const [ok, label, cls] of [[true, '✓', 'bg-emerald-500 hover:bg-emerald-400'], [false, '✗', 'bg-red-500 hover:bg-red-400']]) {
          const b = el('button', 'grid size-8 place-items-center rounded-lg font-bold text-slate-950 transition ' + cls, label);
          b.title = ok ? 'Bonne réponse' : 'Mauvaise réponse';
          b.onclick = () => send({ judge: g.id, ok });
          row.append(b);
        }
      }
      return row;
    }));
  }
}
const set = (e, txt) => { if (e.textContent !== String(txt)) e.textContent = txt; };
</script>
</body>
</html>
