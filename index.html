<!doctype html>
<html lang="fr" class="h-full bg-slate-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les jeux</title>
<link rel="stylesheet" href="/style.css">
<script>
  // anciens liens d'invitation de Patate (/?pin=1234) : ils mènent toujours à la partie
  if (new URLSearchParams(location.search).has('pin')) location.replace('/patate.html' + location.search);
</script>
</head>
<body class="h-full text-slate-100 antialiased">
<main class="mx-auto min-h-full max-w-xl px-4 pt-12 pb-10 sm:pt-20">
  <h1 class="px-1 text-[34px] leading-tight font-bold">Les jeux</h1>
  <p class="mt-1 px-1 text-[15px] text-slate-400">Des jeux à plusieurs, dans le navigateur. Rien à installer.</p>

  <h2 class="mt-7 mb-2 px-4 text-[13px] text-slate-400 uppercase">Choisis un jeu</h2>
  <nav id="gameList" aria-label="Tous les jeux" class="overflow-hidden rounded-xl bg-slate-900 ring-1 ring-white/5"></nav>
  <p class="mt-2 px-4 text-[13px] leading-snug text-slate-400">Crée une partie, puis envoie le code à 4 chiffres ou le lien à tes amis. Ton pseudo est gardé d'un jeu à l'autre.</p>
</main>
<script src="/common.js"></script>
</body>
</html>
