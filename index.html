<!doctype html>
<html lang="fr" class="h-full bg-slate-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les jeux</title>
<link rel="stylesheet" href="/style.css">
<script>
  // anciens liens d'invitation de Patate (/?pin=1234) : ils mènent toujours à la partie
  if (new URLSearchParams(location.search).has('pin')) location.replace('/patate.html' + location.search);
</script>
</head>
<body class="h-full text-slate-100 antialiased">
<main class="mx-auto flex min-h-full max-w-md flex-col justify-center gap-5 p-4">
  <div aria-hidden="true" class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-[28rem] bg-linear-to-b from-slate-500/15 to-transparent"></div>
  <header>
    <h1 class="text-3xl font-black tracking-tight">Les jeux</h1>
    <p class="mt-1 text-sm text-slate-400">Choisis un jeu, crée une partie et envoie le code à tes amis.</p>
  </header>
  <nav id="gameList" aria-label="Tous les jeux" class="flex flex-col gap-3"></nav>
</main>
<script src="/common.js"></script>
</body>
</html>
