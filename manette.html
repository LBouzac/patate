<!doctype html>
<html lang="fr" class="h-full bg-slate-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>if (localStorage.theme) document.documentElement.dataset.theme = localStorage.theme; // style choisi (common.js), avant l'affichage</script>
<meta name="theme-color" content="#020617">
<title>Manette</title>
<link rel="stylesheet" href="/style.css">
<style>
  #game { height: 100dvh; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .nope { touch-action: none; }
  .ring-cool { background: conic-gradient(rgba(255,255,255,.9) var(--p, 100%), rgba(255,255,255,.15) 0); }
  @keyframes pop { from { transform: scale(.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .pop { animation: pop .3s cubic-bezier(.2,1.6,.4,1) both; }
</style>
</head>
<body class="h-full text-slate-100 antialiased">

<!-- Accueil -->
<main id="home" class="mx-auto min-h-full max-w-xl px-4 pt-4 pb-16">
  <a href="/" class="-ml-1 inline-flex items-center gap-0.5 py-2 text-[17px] text-amber-400 transition-opacity hover:opacity-80">
    <i data-icon="chevron-left" class="size-5"></i>Les jeux
  </a>
  <form class="mt-4">
    <div class="flex items-center gap-3 px-1">
      <span class="grid size-11 shrink-0 place-items-center rounded-[10px] bg-slate-600 text-white"><i data-icon="phone" class="size-7"></i></span>
      <h1 class="text-[34px] leading-tight font-bold">Manette</h1>
    </div>
    <p class="mt-2 px-1 text-[15px] text-slate-400">Ton téléphone devient ta manette, le jeu s'affiche sur la télé.</p>

    <h2 class="mt-7 mb-2 px-4 text-[13px] text-slate-400 uppercase">Ton pseudo</h2>
    <label class="block">
      <span class="sr-only">Pseudo</span>
      <input id="name" maxlength="12" required autocomplete="nickname" placeholder="Ton pseudo" class="h-[50px] w-full rounded-xl bg-slate-900 px-4 text-[17px] ring-1 ring-white/5 placeholder:text-slate-500 focus-visible:ring-2 focus:outline-none focus-visible:ring-amber-400">
    </label>

    <h2 class="mt-7 mb-2 px-4 text-[13px] text-slate-400 uppercase">Code affiché sur la télé</h2>
    <div class="flex items-center rounded-xl bg-slate-900 ring-1 ring-white/5">
      <label class="block min-w-0 flex-1">
        <span class="sr-only">Code</span>
        <input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Code à 4 chiffres"
          class="h-[50px] w-full rounded-l-xl bg-transparent px-4 font-mono text-[17px] tracking-widest placeholder:font-sans placeholder:tracking-normal placeholder:text-slate-500 focus:outline-none">
      </label>
      <button id="join" class="h-[50px] shrink-0 rounded-r-xl px-4 text-[17px] font-semibold text-amber-400 transition hover:bg-white/5 active:bg-white/10">Rejoindre</button>
    </div>
    <p class="mt-2 px-4 text-[13px] leading-snug text-slate-400">Le plus simple : scanne le QR code de la télé avec l'appareil photo. Pas encore d'écran ?
      Ouvre <a href="/tele.html" class="text-amber-400 underline">l'écran télé</a> sur la télé ou sur l'ordinateur branché dessus.</p>

    <p id="errBox" role="alert" class="mt-4 flex min-h-5 items-center justify-center gap-2 text-[15px] text-red-400">
      <i data-icon="exclamation-triangle" class="size-4" id="errIcon"></i><span id="err"></span>
    </p>
  </form>
</main>

<!-- Manette -->
<div id="game" data-nochat hidden class="mx-auto flex max-w-xl flex-col px-3 pt-[max(env(safe-area-inset-top),8px)] pb-[max(env(safe-area-inset-bottom),10px)]">
  <header class="flex items-center gap-2 py-1">
    <span id="meDot" class="grid size-9 shrink-0 place-items-center rounded-full text-[17px] font-black text-slate-950"></span>
    <span id="meName" class="min-w-0 truncate text-[17px] font-semibold"></span>
    <span id="meCrown" hidden class="text-amber-300" title="Tu es le chef : tu choisis le jeu"><i data-icon="crown" class="size-5"></i></span>
    <span class="ml-auto flex items-center gap-1.5">
      <button id="menuBtn" hidden class="h-9 rounded-full bg-white/10 px-3 text-[15px] font-semibold transition active:bg-white/20">Jeux</button>
      <button id="quit" class="h-9 rounded-full bg-white/10 px-3 text-[15px] text-slate-300 transition active:bg-white/20">Quitter</button>
    </span>
  </header>
  <div id="pad" class="flex min-h-0 flex-1 flex-col"></div>
</div>

<script src="/common.js"></script>
<script>
const pad = $('pad');
const el = (tag, cls = '', ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids.filter(k => k != null && k !== false)); return e; };
const btn = (cls, onclick, ...kids) => { const b = el('button', cls, ...kids); b.onclick = onclick; return b; };
const buzz = p => navigator.vibrate?.(p);
function dot(p, cls = 'size-10 text-[18px]') { const d = el('span', 'grid shrink-0 place-items-center rounded-full font-black text-slate-950 ' + cls, (p.name || '?')[0].toUpperCase()); d.style.background = p.color; return d; }
const big = 'flex h-[56px] w-full items-center justify-center gap-2 rounded-2xl text-[18px] font-bold transition active:scale-[0.98]';
const hint = (...t) => el('p', 'text-center text-[15px] leading-snug text-slate-400', ...t);
const center = (...k) => el('div', 'flex flex-1 flex-col items-center justify-center gap-4 px-2 text-center', ...k);
const seconds = () => { const s = el('span', 'font-mono tabular-nums'); s.dataset.secs = ''; return s; };

let st = null, key = '', bigDraw = null;
function join() {
  connect('/ws/manette', $('pin').value.trim(), '', onState);
  navigator.wakeLock?.request('screen').catch(() => {}); // l'écran ne s'éteint pas pendant qu'on joue (https seulement)
}
$('join').onclick = e => { e.preventDefault(); if (!/^\d{4}$/.test($('pin').value.trim())) return setErr('Le code fait 4 chiffres'); join(); };
$('quit').onclick = () => { location.href = location.pathname + (st ? '?pin=' + st.pin : ''); }; // la page se recharge : on quitte le salon
$('menuBtn').onclick = () => { if (confirm('Arrêter ce jeu et revenir au choix du jeu ?')) send({ menu: true }); };
if ($('pin').value && $('name').value) $('join').focus(); // QR code scanné, pseudo connu : il ne reste qu'à toucher Rejoindre
else if ($('pin').value) $('name').focus();

function onState(m) {
  if (m === null) { st = null; key = ''; stopStick(); return; }
  if (m.hb) return;
  if ('big' in m) { bigDraw = m.big; key = ''; if (st) render(); return; } // le dessin à deviner arrive à part
  const was = st;
  st = m;
  if (was && was.run !== m.run) { strokes = []; drawStep = sentStep = -1; textDraft = ''; key = ''; } // nouvelle partie (même relancée)
  feel(was, m);
  if (m.game === 'chaine') chainDue(m.v);
  render();
}

function render() {
  const me = st.me;
  $('meDot').textContent = me.name[0].toUpperCase(); $('meDot').style.background = me.color;
  $('meName').textContent = me.name;
  show($('meCrown'), me.host);
  show($('menuBtn'), me.host && st.game !== '');
  const v = st.v || {};
  if (st.game === 'sumo' || st.game === 'course') { // manettes construites une seule fois : rien ne lâche sous le doigt
    const k = JSON.stringify([st.game, me.host]);
    if (k !== key) { key = k; livePad = st.game === 'sumo' ? sumoBuild() : raceBuild(); pad.replaceChildren(livePad.root); }
    livePad.update(v);
  } else {
    stopStick(); tiltOff();
    const k = JSON.stringify([st.game, me.host, st.game ? { ...v, left: 0 } : quizScreen === 'edit' ? ['edit', st.quiz] : [quizScreen, st.players, (st.quiz || []).length]]);
    if (k !== key) {
      key = k;
      const view = st.game === '' ? lobby() : st.game === 'quiz' ? quiz(v) : st.game === 'imposteur' ? impostor(v) : chain(v);
      pad.replaceChildren(view);
    }
  }
  for (const t of pad.querySelectorAll('[data-secs]')) t.textContent = v.left ?? '';
}

// le chef relance ou change de jeu
function hostEnd() {
  if (!st.me.host) return hint('Le chef peut rejouer ou changer de jeu.');
  return el('div', 'flex w-full flex-col gap-2',
    btn(big + ' bg-amber-400 text-slate-950', () => send({ again: true }), icon('arrow-path', 'size-5'), 'Rejouer'),
    btn(big + ' bg-white/10', () => send({ menu: true }), 'Changer de jeu'));
}

// ---------- Salon : le chef choisit le jeu ----------
function lobby() {
  if (st.me.host && quizScreen === 'menu') return quizMenu();
  if (st.me.host && quizScreen === 'edit') return quizEditor();
  const host = st.players.find(p => p.host);
  const list = el('div', 'flex flex-wrap justify-center gap-3', ...st.players.map(p => el('span', 'flex items-center gap-1.5 rounded-full bg-white/5 py-1 pr-3 pl-1 text-[15px]', dot(p, 'size-7 text-[13px]'), p.name)));
  if (!st.me.host) return center(el('div', 'text-[22px] font-bold', `${host?.name} choisit le jeu…`), hint('Regarde la télé. Le jeu démarre tout seul sur ton téléphone.'), list);
  return el('div', 'flex flex-1 flex-col gap-3 overflow-y-auto py-2',
    el('h2', 'px-1 text-[22px] font-bold', 'Choisis un jeu'),
    hint(`Tu es le chef. ${st.players.length} joueur${st.players.length > 1 ? 's' : ''} connecté${st.players.length > 1 ? 's' : ''}.`),
    ...TV_GAMES.map(g => {
      const ok = st.players.length >= g.min;
      const b = btn('flex items-center gap-3 rounded-2xl bg-slate-900 p-4 text-left ring-1 ring-white/5 transition active:scale-[0.98] disabled:opacity-40',
        () => { if (g.id === 'quiz') { quizScreen = 'menu'; key = ''; render(); } else send({ play: g.id }); },
        el('span', 'grid size-12 shrink-0 place-items-center rounded-xl text-white ' + g.tile, icon(g.icon, 'size-8')),
        el('span', 'min-w-0 flex-1', el('span', 'block text-[18px] font-semibold', g.name),
          el('span', 'mt-0.5 block text-[13px] leading-snug text-slate-400', ok ? g.tag : `Il faut au moins ${g.min} joueurs.`)),
        icon('chevron-right', 'size-5 text-slate-500'));
      b.disabled = !ok;
      return b;
    }),
    el('div', 'mt-2', list));
}

// ---------- Quiz : questions au hasard, ou celles du chef (gardées par le salon, jamais enregistrées) ----------
let quizScreen = '', qDraft = { q: '', a: ['', '', '', ''], at: -1 }, pasteDraft = '';
const field = (cls, placeholder, value, max, oninput) => {
  const i = el('input', 'h-11 w-full rounded-xl bg-slate-900 px-3 text-[16px] ring-1 ring-white/10 placeholder:text-slate-500 focus:ring-2 focus:ring-indigo-400 focus:outline-none ' + cls);
  i.placeholder = placeholder; i.value = value; i.maxLength = max; i.oninput = () => oninput(i.value);
  return i;
};
const back = to => btn('inline-flex items-center gap-0.5 self-start py-1 text-[16px] text-indigo-300', () => { quizScreen = to; key = ''; render(); }, icon('chevron-left', 'size-5'), 'Retour');
function quizMenu() {
  const n = (st.quiz || []).length;
  const mine = btn(big + ' bg-indigo-500 text-white disabled:opacity-40', () => { quizScreen = ''; send({ play: 'quiz', mine: true }); }, `Mes questions (${n})`);
  mine.disabled = !n;
  return el('div', 'flex flex-1 flex-col gap-3 py-2',
    back(''),
    el('h2', 'px-1 text-[22px] font-bold', 'Quiz rapide'),
    btn(big + ' bg-indigo-500 text-white', () => { quizScreen = ''; send({ play: 'quiz' }); }, `${10} questions au hasard`),
    mine,
    btn(big + ' bg-white/10', () => { quizScreen = 'edit'; key = ''; render(); }, icon('sparkles', 'size-5'), n ? 'Modifier mes questions' : 'Écrire mes questions'),
    hint('Tes questions restent tant que la télé est ouverte. Rien n\'est enregistré.'));
}
function setQuiz(list) { send({ questions: list }); }
function quizEditor() {
  const list = st.quiz || [];
  const save = () => {
    const q = { q: qDraft.q.trim(), a: qDraft.a.map(x => x.trim()) };
    if (!q.q || q.a.some(x => !x)) return alert('Il faut la question et les 4 réponses.');
    if (new Set(q.a.map(x => x.toLowerCase())).size < 4) return alert('Les 4 réponses doivent être différentes.');
    const next = [...list];
    if (qDraft.at >= 0) next[qDraft.at] = q; else next.push(q);
    if (next.length > 50) return alert('50 questions au plus.');
    qDraft = { q: '', a: ['', '', '', ''], at: -1 };
    setQuiz(next);
  };
  const paste = () => { // une question par ligne : question ; bonne ; fausse ; fausse ; fausse
    const next = [...list], bad = [];
    pasteDraft.split('\n').map(l => l.trim()).filter(Boolean).forEach((l, i) => {
      const p = l.split(/\s*[;|\t]\s*/).filter(x => x !== '');
      if (p.length === 5 && new Set(p.slice(1).map(x => x.toLowerCase())).size === 4) next.push({ q: p[0], a: p.slice(1) }); else bad.push(i + 1);
    });
    if (bad.length) alert(`Ligne${bad.length > 1 ? 's' : ''} ignorée${bad.length > 1 ? 's' : ''} : ${bad.join(', ')}. Il faut 5 morceaux séparés par « ; » et 4 réponses différentes.`);
    pasteDraft = '';
    setQuiz(next.slice(0, 50));
  };
  const rows = list.map((q, i) => el('div', 'flex items-start gap-2 rounded-xl bg-slate-900 p-3 ring-1 ring-white/5',
    btn('min-w-0 flex-1 text-left', () => { qDraft = { q: q.q, a: [...q.a], at: i }; key = ''; render(); },
      el('span', 'block text-[15px] font-semibold leading-snug', `${i + 1}. ${q.q}`),
      el('span', 'mt-1 block text-[13px] text-slate-400', el('b', 'text-emerald-400', '✓ ' + q.a[0]), ' · ' + q.a.slice(1).join(' · '))),
    btn('grid size-8 shrink-0 place-items-center rounded-full bg-white/10 text-slate-300 active:bg-white/20', () => { if (confirm('Supprimer cette question ?')) setQuiz(list.filter((_, j) => j !== i)); }, '×')));
  const area = el('textarea', 'w-full rounded-xl bg-slate-900 p-3 text-[14px] ring-1 ring-white/10 placeholder:text-slate-500 focus:ring-2 focus:ring-indigo-400 focus:outline-none');
  area.rows = 4; area.value = pasteDraft; area.oninput = () => { pasteDraft = area.value; };
  area.placeholder = 'Capitale du Gers ? ; Auch ; Agen ; Pau ; Tarbes';
  return el('div', 'flex flex-1 flex-col gap-3 overflow-y-auto py-2',
    back('menu'),
    el('div', 'flex items-baseline justify-between px-1', el('h2', 'text-[22px] font-bold', 'Mes questions'), el('span', 'text-[14px] text-slate-400', `${list.length}/50`)),
    hint('Gardées tant que la télé est ouverte, jamais enregistrées. Touche une question pour la modifier.'),
    ...rows,
    el('div', 'flex flex-col gap-2 rounded-2xl bg-white/5 p-3',
      el('div', 'text-[15px] font-semibold', qDraft.at >= 0 ? `Modifier la question ${qDraft.at + 1}` : 'Nouvelle question'),
      field('', 'La question', qDraft.q, 160, v => { qDraft.q = v; }),
      field('ring-emerald-500/60', 'Bonne réponse', qDraft.a[0], 60, v => { qDraft.a[0] = v; }),
      ...[1, 2, 3].map(i => field('', `Mauvaise réponse ${i}`, qDraft.a[i], 60, v => { qDraft.a[i] = v; })),
      el('div', 'flex gap-2', btn(big + ' bg-indigo-500 text-white', save, qDraft.at >= 0 ? 'Enregistrer' : 'Ajouter'),
        qDraft.at >= 0 && btn(big + ' w-auto bg-white/10 px-4', () => { qDraft = { q: '', a: ['', '', '', ''], at: -1 }; key = ''; render(); }, 'Annuler'))),
    el('details', 'rounded-2xl bg-white/5 p-3',
      el('summary', 'cursor-pointer text-[15px] font-semibold', 'Coller une liste'),
      el('p', 'my-2 text-[13px] leading-snug text-slate-400', 'Une question par ligne : la question, la bonne réponse puis 3 mauvaises, séparées par « ; ». Depuis un tableur, le copier-coller marche aussi.'),
      area, el('div', 'mt-2', btn(big + ' bg-indigo-500 text-white', paste, 'Ajouter ces questions'))),
    list.length > 0 && btn('self-center py-2 text-[14px] text-rose-300', () => { if (confirm('Effacer toutes tes questions ?')) setQuiz([]); }, 'Tout effacer'));
}

// ---------- Sumo : joystick à gauche, dash à droite ----------
let stick = null, stickSent = 0, stickTimer = 0;
function stopStick() { stick = null; clearInterval(stickTimer); stickTimer = 0; }
function sendStick(force) {
  const now = performance.now();
  if (!force && now - stickSent < 50) return;
  stickSent = now;
  send(stick ? { x: +stick.x.toFixed(2), y: +stick.y.toFixed(2) } : { x: 0, y: 0 });
}
// La manette Sumo est construite une seule fois : la reconstruire ferait lâcher le joystick sous le doigt.
function sumoBuild() {
  const status = el('span', 'text-[17px] font-semibold'), score = el('span', 'flex gap-1.5');
  const botN = el('span', 'text-slate-400');
  const bots = st.me.host && el('div', 'flex items-center justify-center gap-2 text-[14px]',
    btn('inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 active:bg-white/20', () => send({ bot: 1 }), icon('user-plus', 'size-4'), 'Bot'),
    btn('inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 active:bg-white/20', () => send({ bot: -1 }), icon('user-minus', 'size-4'), 'Bot'),
    botN);
  const zone = el('div', 'nope relative flex-[3] overflow-hidden rounded-3xl bg-slate-900 ring-1 ring-white/5');
  const base = el('div', 'pointer-events-none absolute size-36 -translate-x-1/2 -translate-y-1/2 rounded-full bg-white/5 ring-2 ring-white/15');
  const knob = el('div', 'pointer-events-none absolute size-16 -translate-x-1/2 -translate-y-1/2 rounded-full shadow-xl');
  knob.style.background = st.me.color;
  const help = el('div', 'pointer-events-none absolute inset-x-0 bottom-4 text-center text-[14px] text-slate-500', 'Glisse le doigt pour bouger');
  zone.append(help, base, knob);
  const R = 64;
  const place = (bx, by, kx, ky) => { base.style.left = bx + 'px'; base.style.top = by + 'px'; knob.style.left = kx + 'px'; knob.style.top = ky + 'px'; };
  const rest = () => { const r = zone.getBoundingClientRect(); place(r.width / 2, r.height / 2, r.width / 2, r.height / 2); };
  requestAnimationFrame(rest);
  addEventListener('resize', () => { if (!stick && zone.isConnected) rest(); });
  zone.onpointerdown = e => {
    zone.setPointerCapture(e.pointerId);
    const r = zone.getBoundingClientRect();
    stick = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, x: 0, y: 0 };
    place(stick.ox, stick.oy, stick.ox, stick.oy);
    clearInterval(stickTimer); stickTimer = setInterval(() => sendStick(true), 400); // au cas où
  };
  zone.onpointermove = e => {
    if (!stick || e.pointerId !== stick.id) return;
    const r = zone.getBoundingClientRect();
    let dx = e.clientX - r.left - stick.ox, dy = e.clientY - r.top - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    stick.x = dx / R; stick.y = dy / R;
    place(stick.ox, stick.oy, stick.ox + dx, stick.oy + dy);
    sendStick(false);
  };
  zone.onpointerup = zone.onpointercancel = e => { if (stick && e.pointerId === stick.id) { stopStick(); rest(); sendStick(true); } };
  const ringEl = el('span', 'ring-cool pointer-events-none absolute -inset-2 -z-10 rounded-full');
  const dash = el('button', 'nope relative isolate grid aspect-square w-full max-w-40 place-items-center rounded-full text-[22px] font-black shadow-2xl transition active:scale-95', 'DASH', ringEl);
  dash.onpointerdown = e => { e.preventDefault(); send({ dash: true }); buzz(25); };
  let wasReady = true, coolFrom = 0;
  const cool = () => {
    const p = Math.min(1, (performance.now() - coolFrom) / 2000);
    ringEl.style.setProperty('--p', p * 100 + '%');
    if (p < 1 && ringEl.isConnected) requestAnimationFrame(cool);
  };
  const root = el('div', 'flex flex-1 flex-col gap-3 py-2',
    el('div', 'flex items-center justify-between px-1', status, score), bots,
    el('div', 'flex min-h-0 flex-1 items-stretch gap-3', zone, el('div', 'flex flex-[2] items-center justify-center', dash)));
  function update(v) {
    status.textContent = v.phase === 'wait' ? (st.me.host ? 'Ajoute un bot ou attends un ami' : 'Il faut un adversaire')
      : v.phase === 'count' ? (v.in ? `Prêt ? ${v.wait}` : 'Tu joues à la prochaine manche')
      : v.phase === 'play' ? (!v.in ? 'Tu joues à la prochaine manche' : v.alive ? 'Pousse-les dehors !' : 'Tombé ! Attends la manche suivante')
      : v.phase === 'round' ? (v.winner ? `${v.winner} gagne la manche` : 'Égalité')
      : `${v.champion} est champion !`;
    score.replaceChildren(...[0, 1, 2].map(i => el('span', 'size-4 rounded-full ' + (i < v.score ? 'bg-amber-300' : 'bg-white/15'))));
    botN.textContent = `${v.bots} bot${v.bots > 1 ? 's' : ''}`;
    const on = v.ready && v.alive;
    dash.classList.toggle('bg-rose-400', on); dash.classList.toggle('text-slate-950', on);
    dash.classList.toggle('bg-slate-700', !on); dash.classList.toggle('text-slate-400', !on);
    if (wasReady && !v.ready) { coolFrom = performance.now(); requestAnimationFrame(cool); } // la recharge s'anime ici
    ringEl.hidden = v.ready;
    wasReady = v.ready;
  }
  return { root, update };
}
let livePad = null;

// ---------- Course : gauche / droite (ou inclinaison), et l'objet au milieu ----------
let steer = 0, steerSent = 0, steerTimer = 0, tilt = null;
function steerTo(v) {
  v = Math.round(v * 20) / 20;
  const now = performance.now();
  if (v === steer && now - steerSent < 400) return;
  if (v !== 0 && v !== steer && Math.abs(v) < 1 && now - steerSent < 60) return; // inclinaison : 15 envois/s au plus
  steer = v; steerSent = now;
  send({ s: v });
}
function tiltOff() { if (tilt) { removeEventListener('deviceorientation', onTilt); tilt = null; } }
// gauche/droite vue par le joueur, selon que le téléphone est tenu en portrait ou en paysage
function onTilt(e) {
  if (!tilt || e.gamma == null) return;
  const a = screen.orientation?.angle ?? window.orientation ?? 0;
  const raw = a === 90 ? e.beta : (a === 270 || a === -90) ? -e.beta : e.gamma;

  }
  if (m.game === 'quiz' && v.phase === 'q' && v.n !== w.n) buzz(30);
  if (m.game === 'imposteur' && v.myTurn && !w.myTurn) buzz([60, 40, 60]);
}
</script>
