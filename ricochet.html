<!doctype html>
<html lang="fr" class="h-full bg-slate-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ricochet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="h-full text-slate-100 antialiased">

<!-- Accueil -->
<main id="home" class="mx-auto min-h-full max-w-xl px-4 pt-4 pb-32">
  <a href="/" class="-ml-1 inline-flex items-center gap-0.5 py-2 text-[17px] text-cyan-400 transition-opacity hover:opacity-80">
    <i data-icon="chevron-left" class="size-5"></i>Les jeux
  </a>
  <form class="mt-4">
    <div class="flex items-center gap-3 px-1">
      <span class="grid size-11 shrink-0 place-items-center rounded-[10px] text-white bg-cyan-500"><i data-icon="bolt" class="size-7"></i></span>
      <h1 class="text-[34px] leading-tight font-bold">Ricochet</h1>
    </div>
    <p class="mt-2 px-1 text-[15px] text-slate-400">Duel de raquettes à deux, ou contre un bot. Premier à 7.</p>

    <h2 class="mt-7 mb-2 px-4 text-[13px] text-slate-400 uppercase">Ton pseudo</h2>
    <label class="block">
      <span class="sr-only">Pseudo</span>
      <input id="name" maxlength="12" required autocomplete="nickname" placeholder="Ton pseudo" class="h-[50px] w-full rounded-xl bg-slate-900 px-4 text-[17px] ring-1 ring-white/5 placeholder:text-slate-500 focus-visible:ring-2 focus:outline-none focus-visible:ring-cyan-400">
    </label>

    <button id="create" class="mt-6 flex h-[50px] w-full items-center justify-center gap-2 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-[17px] font-semibold text-slate-950 transition active:scale-[0.98]">
      <i data-icon="plus-circle" class="size-5"></i> Créer un duel
    </button>

    <h2 class="mt-7 mb-2 px-4 text-[13px] text-slate-400 uppercase">Rejoindre une partie</h2>
    <div class="flex items-center rounded-xl bg-slate-900 ring-1 ring-white/5">
      <label class="block min-w-0 flex-1">
        <span class="sr-only">Code de la partie</span>
        <input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Code à 4 chiffres"
          class="h-[50px] w-full rounded-l-xl bg-transparent px-4 font-mono text-[17px] tracking-widest placeholder:font-sans placeholder:tracking-normal placeholder:text-slate-500 focus:outline-none">
      </label>
      <button id="join" class="h-[50px] shrink-0 rounded-r-xl px-4 text-[17px] font-semibold text-cyan-400 transition hover:bg-white/5 active:bg-white/10">Rejoindre</button>
    </div>
    <p class="mt-2 px-4 text-[13px] leading-snug text-slate-400">Celui qui a créé la partie te donne le code, ou t'envoie directement le lien.</p>

    <p id="errBox" role="alert" class="mt-4 flex min-h-5 items-center justify-center gap-2 text-[15px] text-red-400">
      <i data-icon="exclamation-triangle" class="size-4" id="errIcon"></i><span id="err"></span>
    </p>
  </form>
</main>
<nav id="games" aria-label="Jeux"></nav>

<!-- Duel -->
<main id="game" hidden class="mx-auto flex min-h-full max-w-[832px] flex-col justify-center gap-3 p-4">
  <header class="flex items-center justify-between gap-2">
    <button id="copy" title="Copier le lien d'invitation"
      class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 font-mono text-lg font-bold text-amber-300 transition hover:bg-white/15">
      <i data-icon="hashtag" class="size-4"></i><span id="pinTxt"></span>
      <i data-icon="link" class="size-4 text-slate-400" id="copyLink"></i><i data-icon="check" class="size-4 text-emerald-400" id="copyOk" hidden></i>
    </button>
    <span class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-sm text-slate-300">
      <i data-icon="trophy" class="size-4 text-amber-300"></i> Premier à 7
    </span>
    <button id="mute" title="Couper / remettre le son (M)" aria-label="Son"
      class="grid size-10 place-items-center rounded-full bg-white/10 text-slate-300 transition hover:bg-white/15">
      <i data-icon="speaker-wave" class="size-5" id="soundOn"></i><i data-icon="speaker-x-mark" class="size-5 text-slate-500" id="soundOff" hidden></i>
    </button>
  </header>

  <!-- tableau des scores : gauche orange, droite cyan -->
  <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
    <div class="flex items-center gap-3 rounded-xl bg-orange-500/10 px-4 py-2 ring-1 ring-orange-400/30">
      <span id="score0" class="font-mono text-4xl font-black text-orange-300 tabular-nums">0</span>
      <span class="min-w-0">
        <span id="name0" class="block truncate font-semibold"></span>
        <span id="tag0" class="block text-xs text-slate-400"></span>
      </span>
    </div>
    <span class="text-sm font-black text-slate-500">VS</span>
    <div class="flex flex-row-reverse items-center gap-3 rounded-xl bg-cyan-500/10 px-4 py-2 text-right ring-1 ring-cyan-400/30">
      <span id="score1" class="font-mono text-4xl font-black text-cyan-300 tabular-nums">0</span>
      <span class="min-w-0">
        <span id="name1" class="block truncate font-semibold"></span>
        <span id="tag1" class="block text-xs text-slate-400"></span>
      </span>
    </div>
  </div>

  <div class="relative">
    <canvas id="c" width="800" height="500" aria-label="Terrain de Ricochet"
      class="block w-full rounded-xl bg-[#0a1020] ring-1 ring-white/10"></canvas>
    <div id="overlay" aria-live="polite" class="pointer-events-none absolute inset-0 grid place-items-center"></div>
  </div>

  <footer class="flex flex-wrap items-center justify-between gap-3 text-sm text-slate-400">
    <div class="flex items-center gap-2">
      <button data-bot="1" title="Jouer contre un bot (B)" class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-slate-200 transition hover:bg-white/15">
        <i data-icon="cpu-chip" class="size-4"></i> Jouer contre un bot
      </button>
      <button data-bot="-1" title="Retirer le bot (N)" class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-slate-200 transition hover:bg-white/15">
        <i data-icon="user-minus" class="size-4"></i> Retirer
      </button>
    </div>
    <div class="flex flex-wrap items-center gap-1 text-xs">
      <kbd class="rounded bg-slate-800 px-1.5 py-0.5 font-mono ring-1 ring-white/10">↑↓</kbd> ou
      <kbd class="rounded bg-slate-800 px-1.5 py-0.5 font-mono ring-1 ring-white/10">Z</kbd><kbd class="rounded bg-slate-800 px-1.5 py-0.5 font-mono ring-1 ring-white/10">S</kbd> bouger
      <kbd class="ml-2 rounded bg-slate-800 px-1.5 py-0.5 font-mono ring-1 ring-white/10">B</kbd><kbd class="rounded bg-slate-800 px-1.5 py-0.5 font-mono ring-1 ring-white/10">N</kbd> bot
      <kbd class="ml-2 rounded bg-slate-800 px-1.5 py-0.5 font-mono ring-1 ring-white/10">M</kbd> son
    </div>
  </footer>
</main>

<script src="/common.js"></script>
<script>
const cv = $('c'), ctx = cv.getContext('2d');
const W = 800, H = 500, PAD_W = 12, PAD_H = 90, PAD_X = 30, BALL_R = 8, TICK_MS = 1000 / 60;
const SIDE = [{ color: '#fb923c', glow: '#f97316', name: 'gauche' }, { color: '#67e8f9', glow: '#06b6d4', name: 'droite' }];

let st = null, prev = null, tRecv = 0, lastCount = 0;

function start(pin) {
  connect('/ws/ricochet', pin, '', m => {
    if (!m) { st = prev = null; return; }
    prev = st; st = m; tRecv = performance.now();
    for (const ev of m.events || []) onEvent(ev);
    if (m.phase === 'count' && Math.ceil(m.wait) !== lastCount) { lastCount = Math.ceil(m.wait); tone(660, 0.1, 'sine', 0.1); }
    hud();
  });
}
$('create').onclick = e => { e.preventDefault(); start(''); };
$('join').onclick = e => { e.preventDefault(); start($('pin').value.trim()); };

// ---------- Clavier ----------
// e.code = touche physique : W/S en QWERTY = Z/S en AZERTY
const map = { ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
const keys = { u: false, d: false };
function setKey(k, v) {
  if (keys[k] === v) return;
  keys[k] = v;
  send(keys);
}
addEventListener('keydown', e => {
  if ($('game').hidden) return;
  if (map[e.code]) { e.preventDefault(); setKey(map[e.code], true); }
  if (e.repeat) return;
  if (e.code === 'KeyB' || e.code === 'KeyN') send({ bot: e.code === 'KeyB' ? 1 : -1 });
  if (e.code === 'KeyM') setMuted(!muted);
});
addEventListener('keyup', e => { if (map[e.code]) setKey(map[e.code], false); });
addEventListener('blur', () => Object.keys(keys).forEach(k => setKey(k, false)));
document.querySelectorAll('[data-bot]').forEach(b => b.onclick = () => { send({ bot: +b.dataset.bot }); b.blur(); });

// ---------- Interface HTML ----------
const set = (el, txt) => { if (el.textContent !== String(txt)) el.textContent = txt; };
let overlayKey = '';

function overlay(key, build) {
  if (key === overlayKey) return;
  overlayKey = key;
  $('overlay').replaceChildren(...(build ? [build()] : []));
}
function bubble(cls, ...children) {
  const el = document.createElement('div');
  el.className = 'flex flex-col items-center gap-2 rounded-[14px] bg-slate-800/85 px-8 py-5 text-center shadow-2xl backdrop-blur-xl ' + cls;
  el.append(...children);
  return el;
}
function line(cls, ...children) {
  const el = document.createElement('div');
  el.className = 'flex items-center gap-2 ' + cls;
  el.append(...children);
  return el;
}

function hud() {
  if (!st) return;
  set($('pinTxt'), st.pin);
  st.pads.forEach((p, i) => {
    set($('score' + i), p ? p.score : 0);
    set($('name' + i), p ? p.name : 'En attente…');
    set($('tag' + i), !p ? '' : p.id === me ? 'Toi' : p.bot ? 'Bot' : 'Adversaire');
  });
  const mine = st.pads.findIndex(p => p && p.id === me);

  if (st.phase === 'wait') overlay('wait', () => bubble('', line('text-lg font-bold', icon('user-plus', 'size-6 text-cyan-300'), 'En attente d\'un adversaire'),
    line('text-sm text-slate-400', 'Donne le code ', Object.assign(document.createElement('b'), { className: 'font-mono text-amber-300', textContent: st.pin }), ' ou joue contre un bot (B)')));
  else if (st.phase === 'count') overlay('c' + Math.ceil(st.wait), () => bubble('',
    Object.assign(document.createElement('div'), { className: 'font-mono text-6xl font-black', textContent: Math.ceil(st.wait) }),
    line('text-sm text-slate-400', 'Tu joues à ' + SIDE[mine]?.name + ' · ↑↓ ou Z/S')));
  else if (st.phase === 'end') overlay('end', () => bubble('',
    line('text-2xl font-black text-amber-300', icon('trophy', 'size-7'), st.winner + ' gagne !'),
    line('text-sm text-slate-400', icon('arrow-path', 'size-4'), 'Revanche dans quelques secondes…')));
  else overlay('', null);
}

// ---------- Son et effets ----------
let particles = [], rings = [], trail = [], shake = 0, flash = null;

function burst(x, y, n, color, speed, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, size: 1.5 + Math.random() * 2.5, color });
  }
}

function onEvent(e) {
  switch (e.kind) {
    case 'hit': {
      const side = SIDE[+e.text];
      tone(Math.min(320 + st.rally * 35, 1100), 0.07, 'square', 0.1); // plus aigu à mesure que l'échange dure
      burst(e.x, e.y, 16, side.color, 220, 0.4);
      rings.push({ x: e.x, y: e.y, r: 6, life: 0.3, color: side.color });
      break;
    }
    case 'wall':
      tone(240, 0.05, 'triangle', 0.07);
      burst(e.x, e.y, 6, '#e2e8f0', 120, 0.25);
      break;
    case 'serve':
      tone(880, 0.09, 'sine', 0.1);
      trail = [];
      break;
    case 'score': {
      const side = +e.text, scorer = st.pads[side];
      tone(scorer && scorer.id === me ? 780 : 300, 0.35, 'sawtooth', 0.1, scorer && scorer.id === me ? 1200 : 120);
      shake = 0.3;
      flash = { color: SIDE[side].glow, life: 0.35 };
      burst(Math.min(Math.max(e.x, 0), W), e.y, 40, SIDE[1 - side].color, 300, 0.7);
      break;
    }
    case 'win':
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, 0, i * 0.12));
      break;
  }
}

// ---------- Terrain (canvas) ----------
// Mouvements fluides : interpolation entre les deux derniers états (≈ 1 image de retard)
function lerpState(now) {
  const a = Math.min((now - tRecv) / TICK_MS, 1), L = (x, y) => x + (y - x) * a;
  let ball = st.ball;
  if (prev && Math.hypot(st.ball.x - prev.ball.x, st.ball.y - prev.ball.y) < 60) ball = { x: L(prev.ball.x, st.ball.x), y: L(prev.ball.y, st.ball.y) };
  const pads = st.pads.map((p, i) => p && prev?.pads[i]?.id === p.id ? { ...p, y: L(prev.pads[i].y, p.y) } : p);
  return { ball, pads };
}

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }

let lastFrame = 0;
function draw(now) {
  requestAnimationFrame(draw);
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  if (!st) return;
  const { ball, pads } = lerpState(now);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) { shake -= dt; const k = shake * 30; ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k); }

  // terrain : halos de couleur de chaque côté, cercle central
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, '#f973161a'); g.addColorStop(0.3, '#0000'); g.addColorStop(0.7, '#0000'); g.addColorStop(1, '#06b6d41a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#ffffff10'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 70, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 4, 0, 7); ctx.fillStyle = '#ffffff18'; ctx.fill();

  if (flash && (flash.life -= dt) > 0) { ctx.fillStyle = flash.color + Math.round(flash.life * 120).toString(16).padStart(2, '0'); ctx.fillRect(0, 0, W, H); }

  // raquettes
  pads.forEach((p, i) => {
    if (!p) return;
    const x = i === 0 ? PAD_X : W - PAD_X - PAD_W;
    glow(SIDE[i].glow, 18);
    ctx.fillStyle = SIDE[i].color;
    ctx.beginPath(); ctx.roundRect(x, p.y - PAD_H / 2, PAD_W, PAD_H, 6); ctx.fill();
    ctx.shadowBlur = 0;
    if (p.id === me) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
  });

  // balle + traînée (plus longue quand elle va vite)
  if (st.phase === 'play') {
    trail.push({ x: ball.x, y: ball.y });
    const speed = Math.hypot(st.ball.vx, st.ball.vy), len = 6 + Math.round(speed / 60);
    while (trail.length > len) trail.shift();
    trail.forEach((t, i) => {
      ctx.globalAlpha = (i / trail.length) * 0.5;
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * (0.4 + 0.6 * i / trail.length), 0, 7);
      ctx.fillStyle = speed > 700 ? '#fde047' : '#e2e8f0'; ctx.fill();
    });
    ctx.globalAlpha = 1;
    glow(speed > 700 ? '#facc15' : '#e2e8f0', 20);
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.shadowBlur = 0;
  }

  // effets
  rings = rings.filter(r => (r.life -= dt) > 0);
  for (const r of rings) {
    r.r += 160 * dt;
    ctx.globalAlpha = r.life / 0.3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.strokeStyle = r.color; ctx.lineWidth = 2; ctx.stroke();
  }
  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(draw);
</script>
</body>
</html>
